<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自己管理">
<title>自己管理</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--main:#121212;--bg:#ffffff;--acc:#4a0707;--sub:#f5f1f1;--line:#e8e2e2;--mute:#8b8484}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px}html.m{font-size:14.5px}html.l{font-size:16.5px}
body{margin:0;background:var(--bg);color:var(--main);font:1rem/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:max(16px,1rem);color:var(--main);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc)}
.i{width:1.35rem;height:1.35rem;fill:currentColor;flex:none;vertical-align:middle}
.i.s{width:1.1rem;height:1.1rem}
#app{max-width:540px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 170px}
#hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
#hd .d{font-size:.85rem;color:var(--mute);letter-spacing:.1em}
#hd h1{margin:0;font-size:1.7rem;font-weight:600;letter-spacing:.05em;line-height:1.3}
.hact{display:flex;gap:4px}
.hact button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--main)}
.hact button:disabled{color:#c9c2c2}
.neu{background:var(--sub);border-radius:18px;box-shadow:6px 6px 14px rgba(0,0,0,.06),-6px -6px 14px rgba(255,255,255,.95)}
.chips{display:flex;gap:12px;margin-bottom:22px}
.chip{flex:1;padding:12px 8px;text-align:center}
.chip b{display:block;font-size:1.6rem;font-weight:600;line-height:1.2}
.chip small{font-size:.8rem;color:var(--mute)}
.sec{margin:22px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{margin:0;font-size:.9rem;letter-spacing:.1em;font-weight:600}
.sec span{font-size:.8rem;color:var(--mute)}
.sec button{font-size:.8rem;color:var(--mute);text-decoration:underline}
.item{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
.item .grow{flex:1;min-width:0}
.t1{font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:.8rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.done .t1{text-decoration:line-through;color:#a49d9d}
.ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--main);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.ck.on{background:var(--main)}
.ck .i{width:15px;height:15px}
.sel{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--main);flex:none}
.sel.on{background:var(--acc);border-color:var(--acc)}
.tag{font-size:.75rem;padding:2px 10px;border-radius:12px;border:1px solid var(--main);white-space:nowrap;flex:none}
.tag.a{background:var(--acc);border-color:var(--acc);color:#fff}
.tag.m{border-color:var(--line);color:var(--mute)}
.star{color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:36px 12px;font-size:.95rem;line-height:1.9}
.empty .btns{justify-content:center;margin-top:14px}
.more{display:block;margin:10px auto;font-size:.85rem;color:var(--mute);text-decoration:underline}
.bar{height:4px;border-radius:2px;background:#e4dede;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.pc{padding:16px;margin-bottom:16px;cursor:pointer}
.pc .row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc h4{margin:0;font-size:1.05rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc p{margin:2px 0 10px;font-size:.8rem;color:var(--mute)}
.lnks{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.lnks a{font-size:.8rem;padding:4px 12px;border-radius:14px;background:var(--main);color:#fff;text-decoration:none;display:inline-flex;gap:4px;align-items:center;max-width:100%;overflow:hidden;white-space:nowrap}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{font-size:.85rem;padding:6px 14px;border-radius:16px;border:1px solid var(--line);white-space:nowrap}
.seg button.on{background:var(--main);color:#fff;border-color:var(--main)}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1}
.tools select{width:auto;min-width:0;flex:1}
.tools .btn{white-space:nowrap;flex:none}
.tools .ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.tools .ib.on{background:var(--main);color:#fff;border-color:var(--main)}
.fab{position:fixed;right:max(20px,calc(50% - 250px));bottom:calc(92px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--main);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:20}
.fab .i{width:26px;height:26px}
.fab[hidden]{display:none}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(500px,calc(100% - 28px));height:60px;border-radius:30px;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:30}
#nav button{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mute);font-size:.7rem;letter-spacing:.06em;padding:4px 8px}
#nav button.on{color:var(--main);font-weight:600}
#nav button.on .i{color:var(--acc)}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(500px,calc(100% - 28px));background:var(--main);color:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:6px;z-index:31;font-size:.85rem}
#selbar[hidden]{display:none}
#selbar span{flex:1}
#selbar button{padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.35)}
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.38);z-index:40}
#sheetWrap[hidden]{display:none}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom));z-index:41;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 14px;font-size:1.1rem;letter-spacing:.06em}
.shx{position:absolute;right:12px;top:12px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.fld{margin-bottom:12px}
.fld label,.lbl{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px;letter-spacing:.04em}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:8px 0}
.err{color:var(--acc);font-size:.8rem;min-height:0}
.warn{background:var(--sub);border-left:3px solid var(--acc);padding:8px 12px;font-size:.85rem;margin:8px 0;border-radius:6px}
.warn:empty{display:none}
.note{font-size:.85rem;color:var(--mute);margin:0 0 10px}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{background:var(--main);color:#fff;border-radius:14px;padding:11px 22px;font-size:.95rem;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:none;color:var(--main);border:1px solid var(--line)}
.btn.danger{background:var(--acc)}
.btn.sm{padding:7px 14px;font-size:.85rem;border-radius:12px}
.lrow{display:flex;gap:6px;margin-bottom:6px}
.lrow input:first-child{flex:.8}.lrow input:nth-child(2){flex:1.4}
.lrow button{width:38px;flex:none;color:var(--mute)}
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--sub);font-size:1rem;text-align:left}
.menu button small{display:block;color:var(--mute);font-size:.8rem}
.grp{margin-bottom:22px;padding:18px;border-radius:20px;background:var(--sub)}
.grp h3{margin:0 0 10px;font-size:.9rem;letter-spacing:.1em}
.seg3{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:8px}
.seg3 button{flex:1;padding:8px}
.seg3 button.on{background:var(--main);color:#fff}
.catrow{display:flex;gap:6px;margin-bottom:6px}
.catrow button{width:40px;flex:none;color:var(--mute)}
.grp .btn{margin:4px 6px 4px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:14px}
.cal .h{font-size:.75rem;color:var(--mute);padding:4px 0}
.cal button{position:relative;padding:11px 0;border-radius:12px;font-size:.9rem}
.cal button.t{background:var(--main);color:#fff}
.cal button.s{outline:1.5px solid var(--acc)}
.cal button.d::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.cal button.t.d::after{background:#fff}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{font-size:1.1rem;letter-spacing:.06em}
.calh button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.num{font-size:2rem;font-weight:600;letter-spacing:.02em}
.num small{font-size:.9rem;font-weight:400}
.chart{display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:12px}
.chart div{flex:1;text-align:center;font-size:.7rem;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;background:var(--main);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px}
.chart div.cur i{background:var(--acc)}
.card{padding:18px;margin-bottom:16px}
.card h3{margin:0 0 8px;font-size:.85rem;letter-spacing:.1em;color:var(--mute);font-weight:500}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.pii{transition:filter .15s}
body.mask .pii{filter:blur(5px)}
body.mask .pii:active,body.mask .item:active .pii{filter:none}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--main);color:#fff;padding:10px 16px;border-radius:16px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 40px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{margin-left:10px;text-decoration:underline;color:#fff}
.dlg{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center}
.dlg .scrim{z-index:0}
.dlg .box{position:relative;background:#fff;border-radius:22px;padding:22px;width:min(360px,calc(100% - 40px));z-index:1}
.dlg p{margin:0 0 8px;font-size:.95rem;white-space:pre-wrap}
#ctx{position:fixed;z-index:65;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:6px;min-width:150px}
#ctx[hidden]{display:none}
#ctx button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:.95rem}
#ctx button.dg{color:var(--acc)}
#lock{position:fixed;inset:0;background:#fff;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
#lock[hidden]{display:none}
#lock input{max-width:240px;text-align:center;letter-spacing:.4em}
#lock h2{margin:0;font-size:1.2rem;letter-spacing:.14em}
.cand{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.cand .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cand .two input{padding:8px 10px}
.hl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.hl span:last-child{color:var(--mute);white-space:nowrap}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;font-size:11pt}#print table{width:100%;border-collapse:collapse}#print td,#print th{border:1px solid #999;padding:4px 6px;text-align:left}}
</style>
</head>

<script>
'use strict';
/* ========== 基本ヘルパー ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const yen=n=>Number(n||0).toLocaleString('ja-JP');
const nfkc=s=>String(s==null?'':s).normalize('NFKC');
const ic=(n,c)=>`<svg class="i ${c||''}"><use href="#i-${n}"/></svg>`;
const WD=['日','月','火','水','木','金','土'];
const STATUS=['未着手','進行中','確認待ち','納品済','入金済'];
const isFin=p=>p.status==='納品済'||p.status==='入金済';
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(new Date(s+'T00:00:00'))===s;
function dshort(s){if(!s)return '';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;const y=d.getFullYear()===new Date().getFullYear()?'':d.getFullYear()+'/';return y+(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'}
function rel(s){const t=today();if(s===t)return '今日';if(s===addDays(t,1))return '明日';if(s<t)return Math.round((new Date(t+'T00:00:00')-new Date(s+'T00:00:00'))/864e5)+'日超過';return dshort(s)}
const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|mailto:)/i.test(u)?u:''};
const parseTags=s=>[...new Set(nfkc(s).split(/[,、\s]+/).map(x=>x.trim()).filter(Boolean))].slice(0,10);
function parseAmt(s){s=nfkc(s).replace(/[,\s円¥]/g,'');if(s==='')return 0;if(!/^\d+$/.test(s))return NaN;const n=Number(s);return n>1e9?NaN:n}
const gross=p=>Math.round((p.amount||0)*(1+(p.tax==null?10:p.tax)/100));
const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.time||'').localeCompare(b.time||'');
const norm=s=>nfkc(s).replace(/\s+/g,'').toLowerCase();
const proj=id=>db.projects.find(p=>p.id===id);

/* ========== データ ========== */
const KEY='jikokanri.v1';
const COLL=['projects','tasks','practice','templates'];
const VER=2;
const DEF=()=>({v:VER,settings:{font:'s',tax:10,goal:20,cats:['Skeb','個人依頼','企業案件','展示','グッズ制作'],lock:null,autoLock:true,mask:false,lastBackup:'',snooze:''},projects:[],tasks:[],practice:[],templates:[],trash:[],history:[]});
let db,undoS=[],redoS=[],startMsg='';
function migrate(o){const d=DEF();const s=Object.assign(d.settings,o.settings||{});const r=Object.assign(d,o);r.settings=s;['projects','tasks','practice','templates','trash','history'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=[]});r.v=VER;COLL.forEach(k=>r[k].forEach(x=>{if(!x.updatedAt)x.updatedAt=x.created||''}));return r}
function load(){
  const raw=localStorage.getItem(KEY);
  if(!raw){db=DEF();return}
  try{db=migrate(JSON.parse(raw))}catch(e){
    try{localStorage.setItem('jikokanri.corrupt.'+Date.now(),raw)}catch(_){}
    const baks=Object.keys(localStorage).filter(k=>k.startsWith('jikokanri.bak.')).sort().reverse();
    for(const k of baks){try{db=migrate(JSON.parse(localStorage.getItem(k)));startMsg='データが壊れていたため、自動バックアップ('+k.slice(14)+')から復元しました';return}catch(_){}}
    db=DEF();startMsg='保存データが壊れていたため、空の状態で始めました(壊れたデータは端末内に退避済み)';
  }
}
let lastSaveOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));lastSaveOk=true;return true}catch(e){lastSaveOk=false;toast('保存に失敗しました。設定からバックアップを書き出してください');return false}}
const okToast=(m,a)=>{if(lastSaveOk)toast(m,a)};
function dailyBackup(){try{const k='jikokanri.bak.'+today();if(!localStorage.getItem(k)&&localStorage.getItem(KEY))localStorage.setItem(k,localStorage.getItem(KEY));Object.keys(localStorage).filter(x=>x.startsWith('jikokanri.bak.')).sort().reverse().slice(7).forEach(x=>localStorage.removeItem(x))}catch(e){}}
const snapRec=()=>{const m={};COLL.forEach(k=>db[k].forEach(x=>{m[k+x.id]=JSON.stringify(x)}));return m};
function commit(label,fn,noTouch){
  undoS.push(JSON.stringify(db));if(undoS.length>60)undoS.shift();redoS=[];
  const before=noTouch?null:snapRec();
  fn();
  if(before){const now=new Date().toISOString();COLL.forEach(k=>db[k].forEach(x=>{if(before[k+x.id]!==JSON.stringify(x))x.updatedAt=now}))}
  db.history.unshift({id:uid(),at:new Date().toISOString(),label});if(db.history.length>300)db.history.length=300;
  save();render();
}
function swapState(from,to,msg){
  if(!from.length)return;const h=db.history;to.push(JSON.stringify(db));
  db=migrate(JSON.parse(from.pop()));db.history=h;db.history.unshift({id:uid(),at:new Date().toISOString(),label:msg});save();render();toast(msg);
}
const undo=()=>swapState(undoS,redoS,'元に戻しました');
const redo=()=>swapState(redoS,undoS,'やり直しました');

/* ========== UI部品 ========== */
const ui={tab:'today',cat:'all',q:'',sort:'due',fav:false,status:'all',cal:{y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()},sel:{on:false,type:'',ids:new Set()},cands:[],dirty:false,limit:{}};
let toastT;
function toast(msg,act){const el=$('#toast');el.innerHTML=esc(msg)+(act?` <button data-act="${act}">元に戻す</button>`:'');el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),act?6000:3200)}
function sheet(html){$('#sheet').innerHTML=`<button class="shx" data-act="sheet-close" aria-label="閉じる">${ic('close')}</button>`+html;$('#sheetWrap').hidden=false;document.body.classList.add('noscroll');$('#sheet').scrollTop=0;ui.dirty=false}
function closeSheet(){$('#sheetWrap').hidden=true;$('#sheet').innerHTML='';document.body.classList.remove('noscroll');ui.dirty=false}
async function tryCloseSheet(){if(ui.dirty&&!await ask('入力中の内容は保存されません。閉じますか?','閉じる'))return;closeSheet()}
function ask(msg,ok,danger){return new Promise(res=>{const w=document.createElement('div');w.className='dlg';w.innerHTML=`<div class="scrim"></div><div class="box"><p>${esc(msg)}</p><div class="btns"><button class="btn ghost" data-r="0">キャンセル</button><button class="btn ${danger?'danger':''}" data-r="1">${esc(ok||'OK')}</button></div></div>`;w.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-r]');if(b){w.remove();res(b.dataset.r==='1')}else if(e.target.classList.contains('scrim')){w.remove();res(false)}});document.body.appendChild(w)})}
function askText(msg,val,ph){return new Promise(res=>{const w=document.createElement('div');w.className='dlg';w.innerHTML=`<div class="scrim"></div><div class="box"><p>${esc(msg)}</p><input id="dlg-in" value="${esc(val||'')}" placeholder="${esc(ph||'')}" maxlength="60"><div class="btns"><button class="btn ghost" data-r="0">キャンセル</button><button class="btn" data-r="1">OK</button></div></div>`;w.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-r]');if(b){const v=w.querySelector('#dlg-in').value.trim();w.remove();res(b.dataset.r==='1'&&v?v:null)}else if(e.target.classList.contains('scrim')){w.remove();res(null)}});document.body.appendChild(w);setTimeout(()=>w.querySelector('input').focus(),50)})}
function download(name,text,mime,bom){const b=new Blob([bom?'\ufeff'+text:text],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1000)}

const TITLES={today:'今日',proj:'案件',cal:'予定',dash:'集計',set:'設定'};
const NAV=[['today','today','今日'],['proj','folder','案件'],['cal','calendar_month','予定'],['dash','bar_chart','集計'],['set','settings','設定']];

function taskRow(t){
  const p=proj(t.projectId),t0=today();
  const od=!t.done&&t.due&&t.due<t0,td=t.due===t0;
  const meta=[p?esc(p.title):'',t.reply?'返信待ち':'',t.time?t.time:'',...(t.tags||[]).map(x=>'#'+esc(x))].filter(Boolean).join(' ・ ');
  const left=ui.sel.on&&ui.sel.type==='task'?`<span class="sel ${ui.sel.ids.has(t.id)?'on':''}"></span>`:`<button class="ck ${t.done?'on':''}" data-act="toggle" data-id="${t.id}" aria-label="完了">${t.done?ic('check'):''}</button>`;
  return `<div class="item ${t.done?'done':''}" data-type="task" data-id="${t.id}">${left}<div class="grow"><div class="t1">${esc(t.title)}</div><div class="sub">${meta||'&nbsp;'}</div></div>${t.fav?`<span class="star">${ic('star-fill','s')}</span>`:''}${t.due?`<span class="tag ${od||td?'a':''}">${rel(t.due)}</span>`:''}</div>`;
}
function projMini(p){return `<div class="item" data-type="proj" data-id="${p.id}"><span>${ic('folder','s')}</span><div class="grow"><div class="t1">${esc(p.title)}</div><div class="sub">${esc(p.cat||'未分類')} ・ ${esc(p.status)}</div></div><span class="tag ${p.due<=today()?'a':''}">${rel(p.due)}</span></div>`}
function capList(key,arr,fn,n){n=n||100;const lim=ui.limit[key]||n;const h=arr.slice(0,lim).map(fn).join('');return h+(arr.length>lim?`<button class="more" data-act="more" data-key="${key}">さらに表示(あと${arr.length-lim}件)</button>`:'')}
const sec=(t,c,h,extra)=>h?`<div class="sec"><h2>${t}</h2><span>${c!=null?c+'件':''}</span>${extra||''}</div>${h}`:'';

function lbDays(){const lb=db.settings.lastBackup;if(!lb)return null;const n=Math.floor((Date.now()-Date.parse(lb))/864e5);return Number.isFinite(n)?Math.max(0,n):null}
function lbText(){const n=lbDays();return n==null?'最後のバックアップ:まだありません':'最後のバックアップ:'+(n===0?'今日':n+'日前')}
function nudge(){const n=lbDays();if(db.tasks.length+db.projects.length<3||db.settings.snooze===today())return '';if(n!=null&&n<7)return '';return `<div class="warn" style="margin:0 0 16px">${n==null?'まだバックアップがありません。':'最後のバックアップから'+n+'日たちました。'}<div class="btns" style="margin-top:6px;justify-content:flex-start"><button class="btn sm" data-act="exp-json">今すぐ書き出す</button><button class="btn ghost sm" data-act="snooze">今日はあとで</button></div></div>`}
function vToday(){
  const t=today(),end=addDays(t,7),T=db.tasks;
  const over=T.filter(x=>!x.done&&x.due&&x.due<t).sort(byDue);
  const now=T.filter(x=>x.due===t).sort((a,b)=>a.done-b.done||(a.time||'').localeCompare(b.time||''));
  const soon=T.filter(x=>!x.done&&x.due>t&&x.due<=end).sort(byDue);
  const nod=T.filter(x=>!x.done&&!x.due);
  const pd=db.projects.filter(p=>p.due&&!isFin(p)&&p.due<=end).sort((a,b)=>a.due.localeCompare(b.due));
  const dueN=T.filter(x=>!x.done&&x.due&&x.due<=t).length;
  const repN=T.filter(x=>!x.done&&x.reply).length;
  const actN=db.projects.filter(p=>!isFin(p)).length;
  const chips=`<div class="chips"><div class="neu chip"><b>${dueN}</b><small>今日までの期日</small></div><div class="neu chip"><b>${repN}</b><small>返信待ち</small></div><div class="neu chip"><b>${actN}</b><small>進行中の案件</small></div></div>`;
  if(!T.length&&!db.projects.length)return chips+`<div class="empty">まだ何も入っていません。<br>右下の ＋ から、タスクや案件を追加してみましょう。<div class="btns"><button class="btn" data-act="new-task">${ic('add','s')}タスクを追加</button><button class="btn ghost" data-act="open-inbox">${ic('content_paste','s')}貼り付け</button></div></div>`;
  const selBtn=`<button data-act="sel-toggle" data-type="task">${ui.sel.on&&ui.sel.type==='task'?'選択をやめる':'選択'}</button>`;
  const h=nudge()+chips+sec('期限切れ',over.length,capList('over',over,taskRow),selBtn)+sec('今日',now.length,capList('now',now,taskRow),over.length?'':selBtn)+sec('案件の期日(7日以内)',pd.length,pd.map(projMini).join(''))+sec('これから(7日以内)',soon.length,capList('soon',soon,taskRow))+sec('期日なし',nod.length,capList('nod',nod,taskRow,10));
  return h+(over.length+now.length+soon.length+nod.length+pd.length?'':`<div class="empty">今日の予定はありません。</div>`);
}
function pFilter(){
  let L=db.projects.slice();
  if(ui.cat!=='all')L=L.filter(p=>(p.cat||'')===(ui.cat==='none'?'':ui.cat));
  if(ui.fav)L=L.filter(p=>p.fav);
  if(ui.status!=='all')L=L.filter(p=>p.status===ui.status);
  const q=norm(ui.q);if(q)L=L.filter(p=>norm([p.title,p.client,p.memo,(p.tags||[]).join(' '),p.cat].join(' ')).includes(q));
  const S={due:(a,b)=>byDue(a,b),new:(a,b)=>(b.created||'').localeCompare(a.created||''),amt:(a,b)=>(b.amount||0)-(a.amount||0),name:(a,b)=>a.title.localeCompare(b.title,'ja')};
  return L.sort(S[ui.sort]);
}
function pCard(p){
  const ts=db.tasks.filter(t=>t.projectId===p.id),dn=ts.filter(t=>t.done).length;
  const prog=ts.length?Math.round(dn/ts.length*100):(p.progress||0);
  const links=(p.links||[]).filter(l=>safeUrl(l.url)).map(l=>`<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">${ic('link','s')}${esc(l.label||'リンク')}</a>`).join('');
  const left=ui.sel.on&&ui.sel.type==='proj'?`<span class="sel ${ui.sel.ids.has(p.id)?'on':''}"></span>`:'';
  return `<div class="neu pc item" data-type="proj" data-id="${p.id}" style="display:block"><div class="row1">${left}<h4>${esc(p.title)}</h4><button data-act="p-fav" data-id="${p.id}" class="star" aria-label="お気に入り">${ic(p.fav?'star-fill':'star','s')}</button></div><p>${esc(p.cat||'未分類')}${p.client?` ・ <span class="pii">${esc(p.client)}</span>`:''} ・ ${esc(p.status)}${p.due?' ・ 期日 '+dshort(p.due):''}${p.amount?' ・ 税抜 '+yen(p.amount)+'円':''}</p><div class="bar"><i style="width:${prog}%"></i></div>${links?`<div class="lnks">${links}</div>`:''}</div>`;
}
function pList(){
  const L=pFilter();
  if(!db.projects.length)return `<div class="empty">案件がまだありません。<br>Skeb・個人依頼・企業案件・展示などを登録して、リンクやメモをまとめましょう。<div class="btns"><button class="btn" data-act="new-proj">${ic('add','s')}案件を追加</button></div></div>`;
  if(!L.length)return `<div class="empty">条件に合う案件がありません。</div>`;
  return capList('proj',L,pCard,50);
}
function vProj(){
  const cats=db.settings.cats;
  const seg=`<div class="seg"><button class="${ui.cat==='all'?'on':''}" data-act="cat" data-v="all">すべて</button>${cats.map(c=>`<button class="${ui.cat===c?'on':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}<button class="${ui.cat==='none'?'on':''}" data-act="cat" data-v="none">未分類</button></div>`;
  const tools=`<div class="tools"><input id="pq" type="search" placeholder="案件名・タグ・メモで検索" value="${esc(ui.q)}"><button class="ib ${ui.fav?'on':''}" data-act="filter-fav" aria-label="お気に入りのみ">${ic('star-fill','s')}</button></div><div class="tools"><select id="psort"><option value="due" ${ui.sort==='due'?'selected':''}>期日順</option><option value="new" ${ui.sort==='new'?'selected':''}>新しい順</option><option value="amt" ${ui.sort==='amt'?'selected':''}>金額が大きい順</option><option value="name" ${ui.sort==='name'?'selected':''}>名前順</option></select><select id="pstat"><option value="all">状況:すべて</option>${STATUS.map(s=>`<option ${ui.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn ghost sm" data-act="sel-toggle" data-type="proj">${ui.sel.on&&ui.sel.type==='proj'?'やめる':'選択'}</button></div>`;
  return seg+tools+`<div id="plist">${pList()}</div>`;
}
function vCal(){
  const {y,m}=ui.cal,first=new Date(y,m,1),off=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),t=today();
  const ev={};db.tasks.forEach(x=>{if(x.due)(ev[x.due]=ev[x.due]||[]).push(x)});db.projects.forEach(p=>{if(p.due)(ev[p.due]=ev[p.due]||[]).push(p)});
  let g=['月','火','水','木','金','土','日'].map(d=>`<div class="h">${d}</div>`).join('')+'<span></span>'.repeat(off);
  for(let d=1;d<=days;d++){const s=y+'-'+pad(m+1)+'-'+pad(d);g+=`<button data-act="cal-day" data-date="${s}" class="${s===t?'t':''} ${ev[s]?'d':''} ${s===ui.cal.sel?'s':''}">${d}</button>`}
  const sel=ui.cal.sel,list=(ev[sel]||[]);
  const rows=list.map(x=>x.status!==undefined?projMini(x).replace(/<span class="tag[^>]*>[^<]*<\/span>/,''):taskRow(x)).join('');
  return `<div class="calh"><button data-act="cal-prev" aria-label="前の月">${ic('chevron_left')}</button><b>${y}年${m+1}月</b><button data-act="cal-next" aria-label="次の月">${ic('chevron_right')}</button></div><div class="cal">${g}</div><div class="calh"><b style="font-size:.95rem">${dshort(sel)} の予定</b><button class="btn ghost sm" style="width:auto;border-radius:12px" data-act="new-task" data-due="${sel}">${ic('add','s')}追加</button></div>${rows||'<div class="empty" style="padding:18px">この日の予定はありません。</div>'}<div class="btns" style="justify-content:center"><button class="btn ghost sm" data-act="cal-today">今月に戻る</button></div>`;
}
function vDash(){
  const n=new Date(),cur=n.getFullYear()+'-'+pad(n.getMonth()+1),months=[];
  for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  const inM=k=>db.projects.filter(p=>p.amount&&p.due&&p.due.slice(0,7)===k);
  const sum=k=>inM(k).reduce((a,p)=>a+p.amount,0);
  const vals=months.map(sum),mx=Math.max(1,...vals);
  const netC=sum(cur),grossC=inM(cur).reduce((a,p)=>a+gross(p),0),paid=inM(cur).filter(p=>p.status==='入金済').reduce((a,p)=>a+p.amount,0);
  const byCat={};inM(cur).forEach(p=>{const c=p.cat||'未分類';byCat[c]=(byCat[c]||0)+p.amount});
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="kv"><span>${esc(c)}</span><span>${yen(v)}円</span></div>`).join('');
  const pm=db.practice.filter(x=>x.date.slice(0,7)===cur).reduce((a,x)=>a+x.min,0),goal=(db.settings.goal||0)*60;
  const days7=[];for(let i=6;i>=0;i--){const s=addDays(today(),-i);days7.push([s,db.practice.filter(x=>x.date===s).reduce((a,x)=>a+x.min,0)])}
  const m7=Math.max(1,...days7.map(x=>x[1]));
  const doneM=db.tasks.filter(x=>x.done&&x.doneAt&&x.doneAt.slice(0,7)===cur).length;
  const finM=db.projects.filter(p=>isFin(p)&&p.due&&p.due.slice(0,7)===cur).length;
  const rec=db.practice.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(x=>`<div class="hl"><span>${dshort(x.date)} ${x.min}分${x.memo?' ・ '+esc(x.memo):''}</span><button data-act="prac-del" data-id="${x.id}" aria-label="削除">${ic('delete','s')}</button></div>`).join('');
  return `<div class="neu card"><h3>${n.getMonth()+1}月の売上(期日が今月の案件・税抜)</h3><div class="num">${yen(netC)}<small> 円</small></div><div class="kv"><span>税込</span><span>${yen(grossC)}円</span></div><div class="kv"><span>うち入金済(税抜)</span><span>${yen(paid)}円</span></div><div class="chart">${months.map((k,i)=>`<div class="${k===cur?'cur':''}"><i style="height:${Math.round(vals[i]/mx*70)}px"></i>${+k.slice(5)}月</div>`).join('')}</div></div>
  <div class="neu card"><h3>案件の内訳(今月・税抜)</h3>${catRows||'<div class="note">今月の金額つき案件はありません。</div>'}</div>
  <div class="neu card"><h3>絵の練習記録</h3><div class="num">${(pm/60).toFixed(1)}<small> 時間 / 目標 ${db.settings.goal||0} 時間</small></div><div class="bar" style="margin-top:8px"><i style="width:${goal?Math.min(100,Math.round(pm/goal*100)):0}%"></i></div><div class="chart" style="height:60px">${days7.map(x=>`<div><i style="height:${Math.round(x[1]/m7*40)}px"></i>${+x[0].slice(8)}</div>`).join('')}</div><div class="btns" style="justify-content:flex-start"><button class="btn sm" data-act="new-practice">${ic('brush','s')}練習を記録</button></div>${rec}</div>
  <div class="neu card"><h3>今月の実績</h3><div class="kv"><span>完了したタスク</span><span>${doneM}件</span></div><div class="kv"><span>納品・入金済の案件</span><span>${finM}件</span></div><div class="kv"><span>登録している案件</span><span>${db.projects.length}件</span></div></div>`;
}

function saveTask(id){

  const due=g('due').value;if(due&&!validDate(due)){$('#e-title').textContent='期日の形式が正しくありません';return}
  const o={title,due,time:g('time').value,projectId:g('proj').value,tags:parseTags(g('tags').value),reply:g('reply').checked,fav:g('fav').checked,memo:g('memo').value};
  const dup=db.tasks.find(x=>x.id!==id&&!x.done&&norm(x.title)===norm(title)&&x.due===due);
  const w=$('#e-dup');

}

/* ========== 貼り付け→タスク ========== */
function findDate(line){
  const s=nfkc(line),n=new Date(),Y=n.getFullYear();let m;
  if(m=s.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?/)){const r=m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);return validDate(r)?r:''}
  if(m=s.match(/(\d{1,2})月(\d{1,2})日/)||s.match(/(?<![\d\/])(\d{1,2})\/(\d{1,2})(?![\d\/])/)){let r=Y+'-'+pad(+m[1])+'-'+pad(+m[2]);if(!validDate(r))return '';if(r<addDays(today(),-60))r=(Y+1)+r.slice(4);return r}
  if(/明後日/.test(s))return addDays(today(),2);if(/明日/.test(s))return addDays(today(),1);if(/今日|本日/.test(s))return today();
  return '';
}
function findAmt(line){const s=nfkc(line);let m=s.match(/([\d,]+(?:\.\d+)?)\s*万\s*円/);if(m)return Math.round(parseFloat(m[1].replace(/,/g,''))*10000);m=s.match(/(?:¥|￥)\s*([\d,]+)|([\d,]+)\s*円/);return m?parseInt((m[1]||m[2]).replace(/,/g,''),10):0}
function parseInbox(text,all){
  const KW=/(提出|納品|返信|締切|締め切り|〆|期限|お願い|確認|送付|支払|入金|修正|依頼|ご連絡|見積|請求|打ち合わせ|打合せ)/;
  const skip=/^(from|to|cc|bcc|sent|date|subject|件名|差出人|宛先|送信日時)\s*[:：]/i;
  const out=[];
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(skip.test(l)||/^https?:\/\/\S+$/.test(l))return;
    const due=findDate(l),bul=/^[・\-\*●■□☐\[\]✔✓\d\.\)）]+\s*/.test(l);
    if(!(all||due||KW.test(l)||bul))return;
    let title=l.replace(/^[・\-\*●■□☐✔✓]+\s*/,'').replace(/^\[\s?\]\s*/,'').replace(/https?:\/\/\S+/g,'').trim();
    if(!title)return;if(title.length>80)title=title.slice(0,80)+'…';
    const reply=/返信|DM|リプ|メッセージ|ご連絡/.test(l);
    const dup=db.tasks.some(x=>!x.done&&norm(x.title)===norm(title)&&x.due===due);
    out.push({title,due,reply,dup,amt:findAmt(l)});
  });
  return out;
}

function inParse(){
  const text=$('#in-text').value;
  if(!text.trim()){$('#in-out').innerHTML='<div class="warn">文章を貼り付けてください。</div>';return}
  if(text.length>200000){$('#in-out').innerHTML='<div class="warn">長すぎます(20万文字まで)。分けて貼り付けてください。</div>';return}
  ui.cands=parseInbox(text,$('#in-all').checked);
  const urls=[...new Set([...text.matchAll(/https?:\/\/[^\s<>"'）)」]+/g)].map(m=>m[0]))].slice(0,10);
  let h='';
  if(!ui.cands.length)h+='<div class="warn">候補が見つかりませんでした。「すべての行をタスクにする」にチェックして、もう一度お試しください。</div>';
  else h+=`<div class="sec"><h2>見つかった候補</h2><span>${ui.cands.length}件</span></div>`+ui.cands.map((c,i)=>`<div class="cand"><input type="checkbox" id="c-${i}" ${c.dup?'':'checked'} style="margin-top:12px"><div class="b"><input id="t-${i}" value="${esc(c.title)}" maxlength="200"><div class="two"><input type="date" id="d-${i}" value="${esc(c.due)}"><label class="chk" style="margin:0"><input type="checkbox" id="r-${i}" ${c.reply?'checked':''}> 返信待ち</label></div>${c.dup?'<div class="err">同じ内容が既にあります(チェックを外してあります)</div>':''}${c.amt?`<div class="sub">金額らしき表記:${yen(c.amt)}円(案件に手入力で反映できます)</div>`:''}</div></div>`).join('')+`<div class="btns"><button class="btn" data-act="in-add">選んだ候補を追加</button></div>`;
  if(urls.length&&db.projects.length)h+=`<div class="sec"><h2>見つかったURL</h2><span>${urls.length}件</span></div><div class="note">案件のリンクとして登録できます。</div>${urls.map((u,i)=>`<div class="hl"><span style="word-break:break-all">${esc(u)}</span></div>`).join('')}<div class="two" style="margin-top:8px"><select id="in-proj">${db.projects.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><button class="btn ghost sm" data-act="in-url">リンクとして登録</button></div>`;
  $('#in-out').innerHTML=h;ui.urls=urls;
}
function inAdd(){
  const rows=[];
  ui.cands.forEach((c,i)=>{if(!$('#c-'+i).checked)return;const title=$('#t-'+i).value.trim(),due=$('#d-'+i).value;if(!title)return;if(due&&!validDate(due))return;rows.push({title,due,reply:$('#r-'+i).checked})});
  if(!rows.length){toast('追加する候補が選ばれていません');return}
  commit('貼り付けから'+rows.length+'件追加',()=>rows.forEach(r=>db.tasks.push({id:uid(),title:r.title,due:r.due,time:'',projectId:'',tags:[],reply:r.reply,fav:false,memo:'',done:false,doneAt:'',created:new Date().toISOString()})));
  try{localStorage.removeItem('jikokanri.draft')}catch(e){}
  closeSheet();okToast(rows.length+'件を追加しました','undo');
}

const csvCell=v=>{let s=String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
async function exportJSON(){if(!await ask('バックアップファイル(JSON)を書き出します。呼び名や金額が含まれます。\nよろしいですか?','書き出す'))return;const o=JSON.parse(JSON.stringify(db));o.settings.lock=null;o.format='jikokanri-backup';o.v=VER;o.exportedAt=new Date().toISOString();download('自己管理_backup_'+today()+'.json',JSON.stringify(o,null,2),'application/json');db.settings.lastBackup=o.exportedAt;save();render();toast('書き出しました')}

  db.projects.forEach(p=>{L.push('','### '+p.title,`- カテゴリ: ${p.cat||'未分類'} / 状況: ${p.status}`,`- 期日: ${p.due||'-'} / 税抜: ${yen(p.amount)}円 (税込 ${yen(gross(p))}円)`);(p.links||[]).forEach(l=>L.push(`- [${l.label||'リンク'}](${l.url})`));if(p.memo)L.push('',p.memo)});
  download('自己管理_'+today()+'.md',L.join('\n'),'text/markdown');toast('書き出しました')}

  download('自己管理_案件_'+today()+'.csv',[H.map(csvCell).join(','),...R].join('\r\n'),'text/csv',true);toast('書き出しました')}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
async function exportICS(){
  const items=db.tasks.filter(t=>!t.done&&t.due).map(t=>({id:t.id,title:t.title,due:t.due,time:t.time})).concat(db.projects.filter(p=>p.due&&!isFin(p)).map(p=>({id:p.id,title:'【案件】'+p.title,due:p.due,time:''})));
  if(!items.length){toast('期日のある未完了の予定がありません');return}

/* --- バックアップの検証(sanitize)と統合(merge) --- */
const S_=(v,n)=>typeof v==='string'?v.slice(0,n):'';
const D_=v=>typeof v==='string'&&validDate(v)?v:'';
const T_=v=>Array.isArray(v)?v.filter(x=>typeof x==='string').slice(0,10).map(x=>x.slice(0,30)):[];
const N_=(v,max)=>{v=Number(v);return Number.isFinite(v)&&v>=0&&v<=max?Math.round(v):0};
const cleanTask=x=>S_(x.title,200).trim()?{id:S_(x.id,40),title:S_(x.title,200),due:D_(x.due),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time||'')?x.time:'',projectId:S_(x.projectId,40),tags:T_(x.tags),reply:!!x.reply,fav:!!x.fav,memo:S_(x.memo,2000),done:!!x.done,doneAt:S_(x.doneAt,40),created:S_(x.created,40),updatedAt:S_(x.updatedAt,40)}:null;
const cleanProj=x=>S_(x.title,120).trim()?{id:S_(x.id,40),title:S_(x.title,120),cat:S_(x.cat,20),client:S_(x.client,40),due:D_(x.due),amount:N_(x.amount,1e9),tax:[0,8,10].includes(x.tax)?x.tax:10,status:STATUS.includes(x.status)?x.status:'未着手',progress:N_(x.progress,100),links:(Array.isArray(x.links)?x.links:[]).slice(0,20).map(l=>({label:S_(l&&l.label,30),url:safeUrl(l&&l.url)})),memo:S_(x.memo,4000),tags:T_(x.tags),fav:!!x.fav,created:S_(x.created,40),updatedAt:S_(x.updatedAt,40)}:null;
const cleanPrac=x=>validDate(x.date)&&N_(x.min,1440)>=1?{id:S_(x.id,40),date:x.date,min:N_(x.min,1440),memo:S_(x.memo,100),updatedAt:S_(x.updatedAt,40)}:null;
const cleanTpl=x=>S_(x.name,60).trim()?{id:S_(x.id,40),name:S_(x.name,60),cat:S_(x.cat,20),memo:S_(x.memo,4000),tax:[0,8,10].includes(x.tax)?x.tax:10,links:(Array.isArray(x.links)?x.links:[]).slice(0,20).map(l=>({label:S_(l&&l.label,30),url:''})),tasks:(Array.isArray(x.tasks)?x.tasks:[]).filter(t=>typeof t==='string').slice(0,50).map(t=>t.slice(0,200)),updatedAt:S_(x.updatedAt,40)}:null;
function sanitize(o){
  let skipped=0;const d=DEF();
  const list=(a,fn)=>(Array.isArray(a)?a:[]).map(x=>{if(!x||typeof x!=='object'||typeof x.id!=='string'||!x.id){skipped++;return null}const r=fn(x);if(!r)skipped++;return r}).filter(Boolean);
  d.projects=list(o.projects,cleanProj);d.tasks=list(o.tasks,cleanTask);d.practice=list(o.practice,cleanPrac);d.templates=list(o.templates,cleanTpl);
  d.trash=(Array.isArray(o.trash)?o.trash:[]).map(x=>{if(!x||typeof x!=='object'||!x.item||typeof x.item!=='object'||typeof x.item.id!=='string'){skipped++;return null}const it=x.type==='task'?cleanTask(x.item):cleanProj(x.item);if(!it){skipped++;return null}return {type:x.type==='task'?'task':'proj',item:it,at:S_(x.at,40)}}).filter(Boolean).slice(0,200);
  const s0=o.settings&&typeof o.settings==='object'?o.settings:{};
  if(['s','m','l'].includes(s0.font))d.settings.font=s0.font;
  if([0,8,10].includes(s0.tax))d.settings.tax=s0.tax;
  if(Number.isFinite(Number(s0.goal))&&s0.goal>=0&&s0.goal<=744)d.settings.goal=Math.round(Number(s0.goal));
  if(Array.isArray(s0.cats))d.settings.cats=[...new Set(s0.cats.filter(c=>typeof c==='string'&&c.trim()).map(c=>c.trim().slice(0,20)))].slice(0,30);
  d.settings.autoLock=s0.autoLock!==false;d.settings.mask=!!s0.mask;d.settings.lastBackup=S_(s0.lastBackup,40);
  COLL.forEach(k=>d[k].forEach(x=>{if(!x.updatedAt)x.updatedAt=x.created||''}));
  return {db:d,skipped};
}
function mergeDb(cur,inc){
  const out=JSON.parse(JSON.stringify(cur)),tomb=new Map(),tm=new Map();
  [...cur.trash,...inc.trash].forEach(x=>{const id=x.item.id,t=tomb.get(id);if(!t||x.at>t)tomb.set(id,x.at);const c=tm.get(id);if(!c||x.at>c.at)tm.set(id,x)});
  COLL.forEach(k=>{
    const m=new Map(out[k].map(x=>[x.id,x]));
    inc[k].forEach(x=>{const c=m.get(x.id);if(!c||(x.updatedAt||'')>(c.updatedAt||''))m.set(x.id,x)});
    out[k]=[...m.values()].filter(x=>{const t=tomb.get(x.id);return !(t&&t>=(x.updatedAt||''))});
  });
  out.trash=[...tm.values()].filter(x=>{const live=out.projects.concat(out.tasks).find(y=>y.id===x.item.id);return !(live&&(live.updatedAt||'')>x.at)}).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,200);
  out.tasks.forEach(t=>{if(t.projectId&&!out.projects.some(p=>p.id===t.projectId))t.projectId=''});
  const st={added:0,updated:0,removed:0};
  COLL.forEach(k=>{const a=new Map(cur[k].map(x=>[x.id,JSON.stringify(x)])),b=new Map(out[k].map(x=>[x.id,JSON.stringify(x)]));b.forEach((v,id)=>{if(!a.has(id))st.added++;else if(a.get(id)!==v)st.updated++});a.forEach((v,id)=>{if(!b.has(id))st.removed++})});
  return {out,st};
}
function restoreFromFile(f,mode){
  if(!f)return;if(f.size>10*1024*1024){toast('ファイルが大きすぎます(10MBまで)');return}
  const r=new FileReader();r.onerror=()=>toast('ファイルを読み込めませんでした');
  r.onload=async()=>{let o;try{o=JSON.parse(r.result)}catch(e){toast('このファイルは壊れているか、形式が違います');return}
    if(!o||typeof o!=='object'||!Array.isArray(o.projects)||!Array.isArray(o.tasks)){toast('自己管理のバックアップではないようです');return}
    if(Number(o.v)>VER){toast('新しい版のバックアップです。このアプリを新しい版に入れ替えてから取り込んでください');return}
    const c=sanitize(o),inc=c.db,skip=c.skipped?`\n(読み取れない${c.skipped}件は取り込みません)`:'';
    if(mode==='merge'){
      const m=mergeDb(db,inc),st=m.st;
      if(!st.added&&!st.updated&&!st.removed){toast('新しい変更はありませんでした');return}
      if(!await ask(`バックアップを今のデータに統合します。\n追加 ${st.added}件 / 更新 ${st.updated}件 / 削除の反映 ${st.removed}件${skip}\n同じものは、更新日時が新しい方を採用します。\n統合した後も「元に戻す」で戻せます。`,'統合する'))return;
      commit('バックアップを統合(追加'+st.added+'・更新'+st.updated+'・削除'+st.removed+')',()=>{m.out.settings=db.settings;m.out.history=db.history;db=m.out},true);
      okToast('統合しました','undo');
    }else{
      if(!await ask(`バックアップ(案件${inc.projects.length}件・タスク${inc.tasks.length}件)で、今のデータを置き換えます。${skip}\n置き換えた後も「元に戻す」で戻せます。`,'置き換える',true))return;
      commit('バックアップから復元',()=>{inc.settings.lock=db.settings.lock;inc.settings.snooze=db.settings.snooze;inc.history=db.history;db=inc},true);
      okToast('復元しました','undo');
    }};
  r.readAsText(f);
}

/* ========== 画面ロック ========== */
function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function hashPin(pin,salt){const s=salt+':'+pin;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return 'c'+cyrb(s)}
function showLock(){const el=$('#lock');el.hidden=false;el.innerHTML=`<h2>自己管理</h2><input id="lock-in" type="password" inputmode="numeric" autocomplete="off" placeholder="合言葉"><div class="err" id="lock-err"></div><button class="btn" data-act="unlock">ひらく</button>`;$('#app').setAttribute('aria-hidden','true');setTimeout(()=>{const i=$('#lock-in');if(i)i.focus()},80)}
async function unlock(){const s=db.settings.lock;if(!s)return;const h=await hashPin($('#lock-in').value,s.salt);if(h===s.hash){$('#lock').hidden=true;$('#lock').innerHTML='';$('#app').removeAttribute('aria-hidden')}else{$('#lock-err').textContent='合言葉が違います';$('#lock-in').value=''}}
async function setLock(){
  const w=document.createElement('div');w.className='dlg';
  w.innerHTML=`<div class="scrim"></div><div class="box"><p>合言葉(4文字以上)を決めてください。忘れると、画面ロックを外せなくなります。\n(その場合は、ブラウザのデータを消す必要があり、バックアップから復元することになります)</p><input id="pin1" type="password" placeholder="合言葉"><input id="pin2" type="password" placeholder="もう一度" style="margin-top:8px"><div class="err" id="pin-err"></div><div class="btns"><button class="btn ghost" data-r="0">キャンセル</button><button class="btn" data-r="1">設定する</button></div></div>`;
  w.addEventListener('click',async e=>{e.stopPropagation();const b=e.target.closest('[data-r]');if(!b&&!e.target.classList.contains('scrim'))return;if(!b||b.dataset.r==='0'){w.remove();return}
    const a=w.querySelector('#pin1').value,c=w.querySelector('#pin2').value,er=w.querySelector('#pin-err');
    if(a.length<4){er.textContent='4文字以上にしてください';return}if(a!==c){er.textContent='2回の入力が一致しません';return}
    const salt=uid();const hash=await hashPin(a,salt);w.remove();commit('画面ロックを設定',()=>{db.settings.lock={salt,hash}});okToast('合言葉を設定しました')});
  document.body.appendChild(w);
}

  case 'in-clear':$('#in-text').value='';$('#in-out').innerHTML='';try{localStorage.removeItem('jikokanri.draft')}catch(_){}break;
  case 'in-url':{const p=proj($('#in-proj').value);if(!p||!ui.urls||!ui.urls.length)break;commit('URLを案件に登録: '+p.title,()=>{p.links=p.links||[];ui.urls.forEach(u=>{if(!p.links.some(l=>l.url===u))p.links.push({label:'メモのリンク',url:u})})});okToast('リンクを登録しました');break}
  case 'prac-del':if(await ask('この練習記録を削除しますか?','削除',true))commit('練習記録を削除',()=>{db.practice=db.practice.filter(x=>x.id!==id)});break;
  }
}

/* ========== イベント ========== */
let lpT=null,lpFired=false;
document.addEventListener('click',e=>{
  const t=e.target;
  if(lpFired){lpFired=false;e.preventDefault();return}
  if(!t.closest('#ctx'))hideCtx();
  const a=t.closest('[data-act]');
  if(a){e.preventDefault();act(a.dataset.act,a,e);return}
  if(t.closest('a'))return;
  const it=t.closest('.item[data-type]');
  if(it){
    if(ui.sel.on&&it.closest('#view')&&it.dataset.type===ui.sel.type){const s=ui.sel.ids;s.has(it.dataset.id)?s.delete(it.dataset.id):s.add(it.dataset.id);render();return}
    openItem(it.dataset.type,it.dataset.id);
  }
});
document.addEventListener('contextmenu',e=>{const it=e.target.closest('.item[data-type]');if(!it||ui.sel.on)return;e.preventDefault();showCtx(e.clientX,e.clientY,it.dataset.type,it.dataset.id)});
document.addEventListener('touchstart',e=>{const it=e.target.closest('.item[data-type]');if(!it||ui.sel.on||e.target.closest('button,a'))return;const x=e.touches[0].clientX,y=e.touches[0].clientY;lpT=setTimeout(()=>{lpFired=true;showCtx(x,y,it.dataset.type,it.dataset.id)},550)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(lpT)},{passive:true}));
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pq'){ui.q=t.value;ui.limit={};$('#plist').innerHTML=pList()}
  else if(t.id==='sq')doSearch();
  else if(t.id==='in-text'){try{localStorage.setItem('jikokanri.draft',t.value)}catch(_){}}
  else if(t.id==='f-amt'||t.id==='f-tax')updGross();
  if(t.closest('#sheet')&&t.id!=='sq'&&t.id!=='in-text')ui.dirty=true;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='psort'){ui.sort=t.value;$('#plist').innerHTML=pList()}
  else if(t.id==='pstat'){ui.status=t.value;$('#plist').innerHTML=pList()}
  else if(t.id==='set-tax')commit('標準の税率を変更',()=>{db.settings.tax=Number(t.value)});
  else if(t.id==='set-goal'){const n=parseAmt(t.value);if(isNaN(n)||n>744){toast('0〜744の数字で入力してください');render();return}commit('練習目標を変更',()=>{db.settings.goal=n})}
  else if(t.id==='set-auto')commit('自動ロックの設定',()=>{db.settings.autoLock=t.checked});
  else if(t.id==='set-mask')commit('ぼかしの設定',()=>{db.settings.mask=t.checked});
  else if(t.classList.contains('cat-in')){const i=+t.dataset.i,old=db.settings.cats[i],v=t.value.trim();if(!v||v===old){render();return}if(db.settings.cats.includes(v)){toast('同じカテゴリがあります');render();return}commit('カテゴリ名変更: '+old+'→'+v,()=>{db.settings.cats[i]=v;db.projects.forEach(p=>{if(p.cat===old)p.cat=v});if(ui.cat===old)ui.cat=v})}
  else if(t.id==='restoreFile')restoreFromFile(t.files[0],ui.restoreMode||'replace');
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lock-in')unlock();if(e.key==='Escape'){if(!$('#sheetWrap').hidden)tryCloseSheet();hideCtx()}});
/* ファイルのドラッグ&ドロップ(.txt / .md のみ) */
document.addEventListener('dragover',e=>{if(e.target.closest('#in-text'))e.preventDefault()});
document.addEventListener('drop',e=>{
  if(!e.target.closest('#in-text'))return;e.preventDefault();
  const f=e.dataTransfer.files[0];if(!f)return;
  if(!/\.(txt|md|markdown)$/i.test(f.name)&&!/^text\//.test(f.type)){toast('いまは .txt / .md のみ読み込めます(PDF・画像の読み取りは次の段階で対応予定)');return}
  if(f.size>2*1024*1024){toast('ファイルが大きすぎます(2MBまで)');return}
  const r=new FileReader();r.onerror=()=>toast('ファイルを読み込めませんでした');r.onload=()=>{const ta=$('#in-text');ta.value=r.result;try{localStorage.setItem('jikokanri.draft',r.result)}catch(_){}toast('読み込みました。「候補を作る」を押してください')};r.readAsText(f);
});
/* 自動ロック */
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(db.settings.lock&&db.settings.autoLock&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();
});
window.addEventListener('error',e=>{try{toast('エラーが起きました: '+(e.message||'不明'))}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{toast('エラーが起きました: '+((e.reason&&e.reason.message)||'不明'))}catch(_){}});

/* ========== アプリの版・更新(自動更新はしない) ========== */
const APP_VER='0.3.0';
let swReg=null,swMsg='';
function swNote(){return swMsg||(('serviceWorker' in navigator)&&location.protocol!=='file:'?'新しい版は、あなたが公開したときだけ届きます。ここで確認すると、すぐ受け取れます。':'この開き方では更新の仕組みは使えません(ホーム画面から開くと使えます)。')}
function swRefresh(){if(ui.tab==='set')render()}
function swWatch(r){
  const onInst=w=>{w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){swMsg='新しい版があります。「適用する」で切り替えるか、アプリを一度閉じて開き直すと切り替わります。';swRefresh()}})};
  if(r.waiting&&navigator.serviceWorker.controller){swMsg='新しい版があります。「適用する」で切り替えるか、アプリを一度閉じて開き直すと切り替わります。'}
  if(r.installing)onInst(r.installing);
  r.addEventListener('updatefound',()=>{if(r.installing)onInst(r.installing)});
}
function swSetup(){
  if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
  navigator.serviceWorker.register('./sw.js').then(r=>{swReg=r;swWatch(r);swRefresh()}).catch(e=>{swMsg='オフライン用の準備ができませんでした: '+(e&&e.message||'');swRefresh()});
}
async function chkUpdate(){
  if(!swReg){toast('いまは確認できません(ホーム画面から開いてください)');return}
  if(!navigator.onLine){toast('ネットにつながっていません');return}
  try{await swReg.update()}catch(e){toast('確認できませんでした: '+(e&&e.message||'通信エラー'));return}
  await new Promise(res=>setTimeout(res,1500));
  if(swReg.installing){await new Promise(res=>{const w=swReg.installing;const f=()=>{if(w.state==='installed'||w.state==='redundant'||w.state==='activated')res()};w.addEventListener('statechange',f);setTimeout(res,8000)})}
  if(swReg.waiting&&navigator.serviceWorker.controller){swMsg='新しい版があります。「適用する」で切り替えるか、アプリを一度閉じて開き直すと切り替わります。';render();toast('新しい版があります')}
  else{swMsg='いまの版('+APP_VER+')が最新です。';render();toast('最新の版です')}
}
async function applyUpdate(){
  if(!swReg||!swReg.waiting){toast('適用できる新しい版がありません');return}
  if(!await ask('新しい版に切り替えて、画面を読み込み直します。\n保存済みのデータはそのまま残ります。','切り替える'))return;
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});
  swReg.waiting.postMessage({type:'SKIP_WAITING'});
}

/* ========== 起動 ========== */
load();dailyBackup();
if(db.settings.lock)showLock();
render();
if(startMsg)setTimeout(()=>toast(startMsg),400);
swSetup();
</script>
